name: Vistas previas de tiendas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vistas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generar páginas /t/<tienda>/
        run: node scripts/vistas-previas.mjs
      - name: Publicar cambios
        run: |
          git add t
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="kevanix-bot" -c user.email="bot@kevanix.local" commit -qm "Vistas previas actualizadas"
          git push
